name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean/lean-toolchain)"
          elan show

      - name: Fetch mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get

      - name: Build Lean project with full log
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Check analytic target statements
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean AnalyticTargets.lean 2>&1 | tee analytic-targets.log

      - name: Print theorem axiom dependencies
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean AuditAxioms.lean 2>&1 | tee axioms.log
          ! grep -q sorryAx axioms.log

      - name: Reject textual trust escapes in compiled core
        working-directory: lean
        run: '! grep -nE "(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)" Erdos971Forum.lean'

      - name: Prepare exact verified paper package
        working-directory: lean
        shell: bash
        run: |
          set -euxo pipefail
          cp Erdos971Forum.lean Erdos971Paper.lean
          sha256sum Erdos971Forum.lean Erdos971Paper.lean > SHA256SUMS.txt

      - name: Upload exact verified Lean package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos971-verified-lean-package
          path: |
            lean/Erdos971Forum.lean
            lean/Erdos971Paper.lean
            lean/AnalyticTargets.lean
            lean/AuditAxioms.lean
            lean/lakefile.toml
            lean/lean-toolchain
            lean/lake-manifest.json
            lean/build.log
            lean/analytic-targets.log
            lean/axioms.log
            lean/SHA256SUMS.txt
          if-no-files-found: error
