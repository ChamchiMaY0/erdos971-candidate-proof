name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies and mathlib cache
        working-directory: lean
        shell: bash
        run: |
          lake update
          lake exe cache get

      - name: Build Lean project
        working-directory: lean
        run: lake build

      - name: Check analytic target statements
        working-directory: lean
        run: lake env lean AnalyticTargets.lean

      - name: Print theorem axiom dependencies
        working-directory: lean
        shell: bash
        run: |
          lake env lean AuditAxioms.lean | tee axioms.log
          ! grep -q sorryAx axioms.log

      - name: Reject textual trust escapes in compiled core
        working-directory: lean
        run: '! grep -nE "(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)" Erdos971Forum.lean'
