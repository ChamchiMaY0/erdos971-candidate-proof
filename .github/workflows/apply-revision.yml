# Applies the exact staged revision on the default branch.
name: Apply revised manuscript sources

on:
  push:
    branches: [main]
    paths:
      - .revision/**
      - .github/workflows/apply-revision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble revised LaTeX and update Lean header
        shell: bash
        run: |
          cat .revision/tex/part00 .revision/tex/part01 .revision/tex/part02 .revision/tex/part03 .revision/tex/part04 > source/erdos971_candidate.tex
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lean/Erdos971Forum.lean')
          text = p.read_text()
          marker = 'open scoped BigOperators'
          if marker not in text:
              raise SystemExit('Lean marker not found')
          suffix = text.split(marker, 1)[1]
          header = '''import Mathlib

/-!
# Finite Lean reduction accompanying the candidate proof of Erdős Problem 971

Author of the accompanying manuscript: KyungMin Han.

This standalone Lean 4.27.0 + mathlib file verifies the finite combinatorial
reduction and the bridge from empty prime occupancy to least congruent primes.
The analytic estimates established informally in the manuscript enter the final
theorem as the explicit hypotheses `hPair`, `hTriple`, `hTotal`, and
`hIncrement`. Thus this file contains a complete proof of the conditional finite
implication, not an end-to-end formalization of the analytic number theory.
-/

open scoped BigOperators'''
          p.write_text(header + suffix)
          PY
          sha256sum source/erdos971_candidate.tex lean/Erdos971Forum.lean

      - name: Commit revised source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/erdos971_candidate.tex lean/Erdos971Forum.lean
          if ! git diff --cached --quiet; then
            git commit -m "Apply revised manuscript and Lean documentation"
            git push
          fi
