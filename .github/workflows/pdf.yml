name: Build manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - erdos971_candidate_proof.tex
      - erdos971_candidate_proof.pdf
      - source/erdos971_candidate.tex
      - .github/workflows/pdf.yml
      - MANIFEST.sha256
  pull_request:
    paths:
      - erdos971_candidate_proof.tex
      - erdos971_candidate_proof.pdf
      - source/erdos971_candidate.tex
      - .github/workflows/pdf.yml
      - MANIFEST.sha256
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical and legacy copies match
        run: |
          cmp erdos971_candidate_proof.tex source/erdos971_candidate.tex
          cmp erdos971_candidate_proof.pdf Erdos971_candidate_verification_note.pdf
          sha256sum --check MANIFEST.sha256

      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: erdos971_candidate_proof.tex
