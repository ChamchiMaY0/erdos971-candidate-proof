name: Build manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - source/erdos971_candidate.tex
      - source/build_pdf.sh
      - .github/workflows/pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: erdos971_candidate.tex
          working_directory: source

      - name: Copy to legacy-compatible public path
        run: cp source/erdos971_candidate.pdf Erdos971_candidate_verification_note.pdf

      - name: Commit generated PDF when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Erdos971_candidate_verification_note.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild revised manuscript PDF"
            git push
          fi
